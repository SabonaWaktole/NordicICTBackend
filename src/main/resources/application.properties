spring.application.name=NordicICTBackend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5331/nordic_ict_db
spring.datasource.username=bojucode
spring.datasource.password=bojucode
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Migration with flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.user=bojucode
spring.flyway.password=bojucode
spring.flyway.baseline-description=Initial migration
spring.flyway.baseline-version=0