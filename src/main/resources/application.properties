spring.application.name=NordicICTBackend

# Database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-description=Initial migration
spring.flyway.baseline-version=0

# Maximum file size
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Supabase
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.filepath=AdminPhotos/
supabase.basefilepath=/storage/v1/object/
supabase.admin.bucket=AdminPhotos

jwt.secret=${JWT_SECRET}
jwt.accessexpiration=${ACCESS_TOKEN_EXPIRATION}
jwt.refreshexpiration=${REFRESH_TOKEN_EXPIRATION}


# GitHub OAuth2 registration
spring.security.oauth2.client.registration.github.client-id=Ov23lijIRUlolwMQmCBb
spring.security.oauth2.client.registration.github.client-secret=efbcfca0b6723caff561ef152cd6bacbd0b4eca3
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.registration.github.scope=read:user


spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# Optional: just for clarity
spring.security.oauth2.client.registration.github.client-name=GitHub


logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter=DEBUG

