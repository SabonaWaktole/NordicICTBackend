name: Ping Render App

# Run every 15 minutes
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          echo "Pinging Render app..."
          curl -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -s https://nordicictbackend-1.onrender.com > /dev/null
          echo "Ping completed at $(date)"
